<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Altalune 360 | Watch Together</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#030710;color:#eaf4ff;font:16px Arial,sans-serif;overflow:hidden}
  main{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  video{width:100%;height:100%;object-fit:contain;background:black}
  #badge{position:absolute;left:10px;top:10px;background:#07182dbb;color:#cce7ff;padding:6px 10px;border:1px solid #367ec0;font-size:12px;pointer-events:none}
  #notice{position:absolute;bottom:12px;left:10px;right:10px;text-align:center;background:#000b;padding:8px;font-size:13px;pointer-events:none}
  #tap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#103c70;color:white;border:1px solid #71baff;border-radius:8px;padding:14px 24px;cursor:pointer;font-weight:bold}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <video id="film" playsinline preload="auto"></video>
  <div id="badge">ALTALUNE 360 · WATCH TOGETHER</div>
  <button id="tap" hidden>▶ Enable Playback</button>
  <div id="notice">Connecting to shared playback clock…</div>
</main>
<script>
'use strict';
const q=new URLSearchParams(window.location.search);
const src=q.get('src') || '';
const anchor=Number(q.get('anchor')||0); // Unix seconds. Zero when paused.
const offset=Math.max(0,Number(q.get('offset')||0));
const paused=q.get('paused')==='1';
const video=document.getElementById('film');
const tap=document.getElementById('tap');
const notice=document.getElementById('notice');
const message=t=>{notice.textContent=t;notice.hidden=false};
const desired=()=>Math.max(0,offset+(paused?0:(Date.now()/1000-anchor)));
function align(){
  if(!Number.isFinite(video.duration) && video.seekable.length===0){
    message('This source may be a live stream; exact seeking is unavailable.');
    return;
  }
  let target=desired();
  if(Number.isFinite(video.duration)) target=Math.min(target,Math.max(0,video.duration-0.1));
  else if(video.seekable.length) {
    const low=video.seekable.start(0),high=video.seekable.end(video.seekable.length-1);
    target=Math.max(low,Math.min(high,target));
  }
  if(Number.isFinite(target) && Math.abs(video.currentTime-target)>1.5){
    try {video.currentTime=target;}catch(e){}
  }
}
async function applyState(){
  align();
  if(paused){video.pause();message('Paused by TV owner · position '+Math.floor(offset)+'s');return;}
  try{await video.play();tap.hidden=true;message('Shared playback clock active');}
  catch(e){tap.hidden=false;message('Click Enable Playback if your viewer blocks autoplay');}
}
if(!src || !/^https:\/\//i.test(src)) {
  message('Owner must set a direct HTTPS MP4/WebM video URL.');
} else {
  video.src=src;
  video.addEventListener('loadedmetadata',applyState);
  video.addEventListener('canplay',()=>{if(!paused && video.paused)applyState();});
  video.addEventListener('error',()=>message('Video could not load. Check the HTTPS URL, codec and hosting permissions.'));
  video.addEventListener('ended',()=>message('Video finished'));
  setInterval(()=>{if(video.readyState>=1)align();},2000);
  tap.addEventListener('click',applyState);
  // Browser tab focus may return well after other viewers started.
  window.addEventListener('focus',()=>{if(video.readyState>=1)applyState();});
}
</script>
</body>
</html>
